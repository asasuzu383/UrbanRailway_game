# --- 公表資料ベースの系統 --------------------------------------------------------
# id: 系統 ID、lines: 走る N02 の線（"運営会社/線名"）、from/to: 起終点の駅名（lines の上の最短経路をたどる）
# peak: 国交省「最混雑区間における混雑率（令和6年度）」のピーク 1 時間の編成両数と本数（系統全体、片方向）
# services: 種別。stops は "all" か停車駅名の一覧、share はピーク本数のうちその種別の割合（資料がなければ仮置き）
# max_speed_kmh: 最高速度（公表値。なければ仮置き）、through: 直通する系統 ID
routes: []
