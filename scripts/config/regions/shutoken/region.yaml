# 地域の設定: 首都圏（docs/design.md §12）。
# 前処理・校正は対象地域を指定して実行する（既定は shutoken）:
#   .venv\Scripts\python.exe scripts\run_pipeline.py --region shutoken
# scripts/config/pipeline.yaml・demand.yaml は全国共通の設定で、ここに書いた値が上書きする。
# 地域ごとの出力: public/data/<id>/、data/interim/<id>/、src/config/regions/<id>/demand.calibrated.json

id: shutoken
name: 首都圏
title: 首都圏 鉄道新線計画シミュレーター

# 平面計算用の投影座標系。地域に合った平面直角座標系か UTM を選ぶ（首都圏: JGD2011 / UTM zone 54N）
crs_metric: "EPSG:6691"

# 都心の基準点（外部選択肢の「都心からの距離」の基準）。首都圏は東京駅
core_point: [139.7671, 35.6812]

# 地図の初期表示範囲 [西, 南, 東, 北]
initial_bounds: [139.0, 35.1, 140.6, 36.2]

# 対象地域（東京都市圏PT調査圏域に準ずる）
region:
  # 全域を対象とする都府県（JIS 都道府県コード）
  full_prefectures: ["11", "12", "13", "14"]  # 埼玉, 千葉, 東京, 神奈川
  # 都府県のうち、この市区町村コード以上を除く（東京都の島しょ部 = 13361 大島町〜13421 小笠原村）
  exclude_codes_from: { "13": 13361 }
  # 一部の市町村だけを対象とする都府県（N03_004 の名称で照合）
  # 茨城県: 第6回東京都市圏PT調査（2018）の圏域図より
  partial_prefectures:
    "08":
      - 土浦市
      - 古河市
      - 石岡市
      - 龍ケ崎市
      - 下妻市
      - 常総市
      - 取手市
      - 牛久市
      - つくば市
      - 鹿嶋市
      - 潮来市
      - 守谷市
      - 坂東市
      - 稲敷市
      - かすみがうら市
      - 神栖市
      - 行方市
      - つくばみらい市
      - 小美玉市
      - 阿見町
      - 美浦村
      - 河内町
      - 利根町
      - 八千代町
      - 五霞町
      - 境町
  # メッシュ・駅の抽出に使う外周バッファ [m]（境界付近の駅勢圏の欠けを防ぐ）
  buffer_m: 3000

# 対象地域をカバーする 1次メッシュ
primary_meshes: ["5238", "5239", "5240", "5338", "5339", "5340", "5438", "5439", "5440"]

# 行政区域（N03）・地価公示（L01）を取得する都府県
prefectures: ["08", "11", "12", "13", "14"]

# 需要モデルの設定のうち地域で変わるもの（scripts/config/demand.yaml を上書き）
demand:
  calibration:
    # 需要構造が駅勢圏で説明できない駅（空港アクセス）を校正から除外
    exclude_station_names: ["羽田空港第1・第2ターミナル", "羽田空港第3ターミナル", "成田空港", "空港第2ビル", "羽田空港第１・第２ターミナル", "羽田空港第３ターミナル"]
