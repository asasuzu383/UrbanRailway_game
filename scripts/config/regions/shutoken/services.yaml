# --- 公表資料ベースの系統 --------------------------------------------------------
# id: 系統 ID、operator: 事業者（N02 の運営会社名）、lines: 走る N02 の線（"運営会社/線名"。省略すると operator の全線）
# 駅の並びの指定（どれか 1 つ）:
#   stations: 停車駅の一覧（快速など）。駅間の延長は lines の上の最短経路
#   waypoints: 経由駅の一覧。各駅停車として途中駅の多い経路でつなぐ（N02 の線には快速線と緩行線が同じ線名で入っているため）
#   from / to: waypoints が 2 駅のときの略記
# peak: ピーク 1 時間の本数・編成両数（片方向）。mlit_jr / mlit_line で国交省の混雑率データ（上の表）を引くか、tph・cars・source を直接書く
# services: 種別。stops は "all" か停車駅名の一覧、share はピーク本数のうちその種別の割合（資料がなければ仮置き）
# max_speed_kmh: 最高速度（公表値。なければ仮置き）
# through: 直通先。系統 ID か { line: "運営会社/線名", at: 接続駅 }（その線を走る系統。仮置き・時刻表ベースも含む）
#
# JR東日本: 停車駅は JR東日本「路線ネットワーク」（東京近郊路線図、2026.3.14 版。https://www.jreast.co.jp/map/ の
# 「東京近郊路線図（車内掲出版）」。ユーザが手動で取得し data/raw/maps/map_tokyo.pdf に配置）で系統ごとの停車駅を確認した。
# 路線図に載っていない種別（中央特快・通勤快速、京浜東北線の日中の快速、湘南新宿ラインの快速・特別快速など）は扱わず、
# 各系統の基本の停車パターンだけを持つ。最高速度はすべて仮置き（通勤形電車の一般的な値）。
