# 既存ネットワークの運行データ（Phase 2 M1）。docs/design.md §11、docs/services_coverage.md。
#
# 運行系統（route）= 列車が走る駅の並び（N02 の法令上の線名とは一致しない。直通先は別の route として through で結ぶ）。
# 運行種別（service）= 系統上の停車駅・駅間所要時間・時間帯別本数。
#
# データ品質（quality = 所要時間の出所。項目ごとの出所は qualityDetail: 停車駅・所要時間・最高速度・ピーク本数・日中本数）:
#   timetable   … 時刻表ベース（ODPT のうち認証なしで取れる CC BY 4.0 のデータから集計。scripts/odpt_download.py → 06_services.py）
#   published   … 公表資料（公表の所要時間を手入力したもの。services_input.yaml の services[].minutes）
#   estimated   … 物理推定（公表資料の停車駅と最高速度から、運転曲線の簡易計算で所要時間を求めたもの。新線と同じ計算）
#   provisional … 仮置き（上記がない線。N02 の線ごとに全駅停車・表定速度は pipeline.yaml の rail.speed_kmh）
# ピーク本数・編成は国交省の混雑率データ（公表資料）、日中本数は手入力がなければピークの比率（仮置き）。
# 公表資料から手で入れる値は services_input.yaml（手入力テンプレート）に書く。優先順は docs/services_input_priority.md。
#
# ODPT の開発者登録（アクセストークン）が必要なデータは使っていない（2026-11-06 時点、登録が承認されていないため）。
# 承認されたら .env に ODPT_ACCESS_TOKEN を置いて odpt_download.py → 06_services.py を実行すれば、
# 下の odpt.operators の access: key の事業者が時刻表ベースに置き換わる（設定で定義した系統より時刻表が優先）。
#
# JR 東日本・大手私鉄の時刻表は使わない: ODPT ではチャレンジ限定ライセンス（常設の公開アプリに使えない）、
# 各社の時刻表サイトは時刻データの転載・加工を禁止しているため（docs/data-sources.md）。

# --- ODPT（時刻表ベース） -------------------------------------------------------
odpt:
  # 平日ダイヤを使う
  calendar: odpt.Calendar:Weekday
  # ピーク: この時間帯（時）に駅を出発する本数の最大の 1 時間。オフピーク: この時間帯の 1 時間平均
  peak_hours: [7, 8]
  offpeak_hours: [10, 11, 12, 13, 14, 15]
  # 種別の停車駅: その種別の列車が通る区間で、停車する割合がこの値以上の駅
  stop_share: 0.5
  # 対象の事業者。public = キー不要のダンプ（CC BY 4.0 等）、key = アクセストークンが必要（公共交通オープンデータ基本ライセンス）
  operators:
    Toei: { name: 東京都, access: public, license: CC BY 4.0 }
    TokyoMetro: { name: 東京地下鉄, access: key, license: 公共交通オープンデータ基本ライセンス }
    MIR: { name: 首都圏新都市鉄道, access: key, license: 公共交通オープンデータ基本ライセンス }
    YokohamaMunicipal: { name: 横浜市, access: key, license: 公共交通オープンデータ基本ライセンス }
    TWR: { name: 東京臨海高速鉄道, access: key, license: 公共交通オープンデータ基本ライセンス }
    Yurikamome: { name: ゆりかもめ, access: key, license: 公共交通オープンデータ基本ライセンス }
    TamaMonorail: { name: 多摩都市モノレール, access: key, license: 公共交通オープンデータ基本ライセンス }
  # 直通先の判定に使う ODPT 事業者名 → N02 の運営会社名（キー不要の範囲外の事業者も含む）
  operator_names:
    Toei: 東京都
    TokyoMetro: 東京地下鉄
    MIR: 首都圏新都市鉄道
    YokohamaMunicipal: 横浜市
    TWR: 東京臨海高速鉄道
    Yurikamome: ゆりかもめ
    TamaMonorail: 多摩都市モノレール
    Keio: 京王電鉄
    Keisei: 京成電鉄
    Keikyu: 京浜急行電鉄
    Hokuso: 北総鉄道
    Shibayama: 芝山鉄道
    Tokyu: 東急電鉄
    Odakyu: 小田急電鉄
    Seibu: 西武鉄道
    Tobu: 東武鉄道
    Sotetsu: 相模鉄道
    SaitamaRailway: 埼玉高速鉄道
    ToyoRapid: 東葉高速鉄道
    JR-East: 東日本旅客鉄道

# --- 運転曲線の簡易計算（公表資料ベースの所要時間） ---------------------------
# 駅間ごとに「加速 → 最高速度で走行 → 減速」の台形（届かなければ三角形）で走行時間を求め、停車時間と余裕を足す。
# Phase 2 M3 の新線の所要時間計算と同じ考え方（src/ 側にも同じ式を実装する）。
runtime:
  accel_kmh_per_s: 3.0     # 起動加速度。E233 系などの通勤電車の標準的な値 3.0 km/h/s（仮置き: 系統ごとの値は未確認）
  decel_kmh_per_s: 3.5     # 常用減速度（仮置き）
  dwell_s: 30              # 標準停車時間（仮置き）
  dwell_major_s: 50        # 乗換駅（2 路線以上）の停車時間（仮置き）
  # 余裕時分・速度制限の係数: (走行時間 + 停車時間) × margin。都営地下鉄 4 線の時刻表（ODPT）の駅間所要時間と比べると、
  # 最高速度 70〜100 km/h で係数なしの計算に対して 1.10〜1.30 倍（中央値 約1.17）だったので 1.15 とした（2026-11-02）
  margin: 1.15
  # 最高速度 [km/h] が未入力の系統と、時刻表との比較に使う既定値（すべて仮置き）。
  # N02 の鉄道区分（rail_type）→ 事業者種別（operator_type: 2=JR在来線, 3=公営, 4=民営, 5=第三セクター）→ default の順に引く
  default_max_speed_kmh:
    rail_type: { "21": 40, "14": 70, "15": 70, "22": 70, "23": 70, "16": 60, "24": 60 }
    operator_type: { "2": 100, "3": 80, "4": 100, "5": 100 }
    default: 100

# --- 仮置きの既定値 ------------------------------------------------------------
provisional:
  # 運行本数 [本/時]（片方向）。事業者種別（N02_002）または鉄道区分（N02_001）ごと。いずれも仮置き
  tph_by_operator_type: { "2": { peak: 12, offpeak: 6 }, "3": { peak: 15, offpeak: 8 }, "4": { peak: 12, offpeak: 6 }, "5": { peak: 8, offpeak: 4 } }
  tph_by_rail_type: { "21": { peak: 10, offpeak: 6 } }   # 路面電車
  # 公表資料ベースの系統でオフピーク本数の資料がないときのピーク比
  offpeak_ratio: 0.5

# --- 国交省の混雑率データ（公表資料）: ピーク 1 時間の本数・平均編成両数・輸送力・輸送人員・混雑率 ------
