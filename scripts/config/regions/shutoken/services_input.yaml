# 運行データの手入力テンプレート（首都圏）。scripts/06_services.py が読む。
#
# 公表資料（各社の公式サイトの路線図・駅の案内・時刻表の冊子など）から手で入れる値をここに書く。
# 入れる順番は docs/services_input_priority.md（乗降客数の多い線から。06_services.py が毎回作り直す）。
# 入れたら次を実行する（PowerShell）:
#   .\.venv\Scripts\python.exe scripts\run_pipeline.py 06_services   # 運行データ → docs/services_coverage.md
#   .\.venv\Scripts\python.exe scripts\calibrate.py                  # 一般化費用の行列と需要モデルの校正
#
# 共通の約束:
# - null は「未入力」。未入力の項目は仮置きの既定値を使う（下の routes は必須項目が null の間は計算に使わない）。
# - 駅名は国土数値情報（N02）の表記（例: 「ケ」と「ヶ」の違いに注意）。間違っていると 06_services.py がエラーで駅名を表示する。
# - source には資料名・URL・閲覧日を書く（docs/data-sources.md に転記する）。時刻表データそのもの（列車ごとの時刻）は書かない。
# - 品質フラグ: 停車駅と最高速度を入れた系統は「物理推定」（運転曲線の簡易計算）、minutes（公表の所要時間）を入れた種別は「公表資料」になる。

# --- 1. 新しく定義する系統（大手私鉄など）---------------------------------------
# 書式は services.yaml の routes と同じ。追加の項目:
#   max_speed_kmh / max_speed_source  最高速度（公表値）と出典。null なら既定値（仮置き、services.yaml の runtime.default_max_speed_kmh）
#   services[].tph_peak     その種別のピーク 1 時間の本数（片方向）。null なら peak の本数を種別の数で等分（仮置き）
#   services[].offpeak_tph  日中（10〜16 時）の 1 時間あたりの本数（片方向）。null ならピークの 0.5 倍（仮置き）
#   services[].minutes      （任意）停車駅ごとの始発駅からの所要時間 [分]。入れると所要時間が公表資料になる
#   services[].stops        all（全駅停車）か停車駅名の一覧。null の種別があると系統ごと使わない（不要な種別は行ごと消す）
