# --- 2. services.yaml の系統（JR）への上書き ---------------------------------------
# 停車駅は JR東日本の路線図（公表資料）で入力済み。最高速度と日中本数が仮置き。
# max_speed_kmh / max_speed_source: 最高速度と出典、services.<種別>.offpeak_tph: 日中 1 時間あたりの本数、offpeak_source: 日中本数の出典
route_overrides:
  jr_yamanote: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_keihin_tohoku: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  # 湘南新宿ラインは国交省のデータに系統別の値が無いので、ピーク本数・編成も
  jr_shonan_shinjuku:
    max_speed_kmh: null
    max_speed_source: null
    peak: { tph: null, cars: null, source: null }
    services: { 普通: { offpeak_tph: null } }
    offpeak_source: null
  jr_chuo_sobu_local: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_chuo_rapid: { max_speed_kmh: null, max_speed_source: null, services: { 快速: { offpeak_tph: null } }, offpeak_source: null }
  jr_saikyo: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_tokaido: { max_speed_kmh: null, max_speed_source: null, services: { 普通: { offpeak_tph: null } }, offpeak_source: null }
  jr_joban_rapid: { max_speed_kmh: null, max_speed_source: null, services: { 快速: { offpeak_tph: null } }, offpeak_source: null }
  jr_yokosuka: { max_speed_kmh: null, max_speed_source: null, services: { 普通: { offpeak_tph: null } }, offpeak_source: null }
  jr_takasaki: { max_speed_kmh: null, max_speed_source: null, services: { 普通: { offpeak_tph: null } }, offpeak_source: null }
  jr_utsunomiya: { max_speed_kmh: null, max_speed_source: null, services: { 普通: { offpeak_tph: null } }, offpeak_source: null }
  jr_sobu_rapid: { max_speed_kmh: null, max_speed_source: null, services: { 快速: { offpeak_tph: null } }, offpeak_source: null }
  jr_nambu: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_yokohama: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_musashino: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_joban_local: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_keiyo: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }
  jr_ome: { max_speed_kmh: null, max_speed_source: null, services: { 各停: { offpeak_tph: null } }, offpeak_source: null }

# --- 3. 系統を定義しない線の本数だけ --------------------------------------------------
# 停車駅まで入れる余裕がない線は、本数だけ入れられる（所要時間は仮置きのまま、本数が公表資料になる）。
# キーは "運営会社/線名"（N02。docs/services_coverage.md の「線ごとの品質」の表の表記）。
# 例: "流鉄/流山線": { peak_tph: 4, offpeak_tph: 3, cars: 2, source: "流鉄 時刻表（2026-11 閲覧）" }
line_frequency: {}

# --- 4. 主要区間の公表所要時間（物理推定との比較用） ---------------------------------
# route（系統 ID）か line（"運営会社/線名"）、種別、区間の駅名、公表の所要時間 [分]（代表的な列車、または標準的な所要時間）。
# 結果は docs/services_coverage.md の「物理推定の検証」。比較だけに使い、計算の値は変えない。
published_times:
  - { route: jr_tokaido, service: 普通, from: 東京, to: 横浜, minutes: null, source: null }
  - { route: jr_chuo_rapid, service: 快速, from: 東京, to: 新宿, minutes: null, source: null }
  - { route: jr_chuo_rapid, service: 快速, from: 新宿, to: 立川, minutes: null, source: null }
  - { route: jr_joban_rapid, service: 快速, from: 上野, to: 取手, minutes: null, source: null }
  - { route: jr_sobu_rapid, service: 快速, from: 東京, to: 千葉, minutes: null, source: null }
  - { route: jr_keihin_tohoku, service: 各停, from: 大宮, to: 東京, minutes: null, source: null }
  - { route: jr_yamanote, service: 各停, from: 渋谷, to: 新宿, minutes: null, source: null }
  - { route: jr_saikyo, service: 各停, from: 大宮, to: 新宿, minutes: null, source: null }
